<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Sparkiee Pet</title>
  <link rel="stylesheet" href="./pet.css" />
  <script type="module" src="./pet.js"></script>
</head>
<body>
  <main id="pet-root" aria-label="Sparkiee desktop pet">
    <button class="pet-button" id="pet-button" type="button" aria-label="Ask your Sparkiee pet to wave" title="Click for a wave, drag to move">
      <div class="pet-sprite" id="pet-sprite" role="img" aria-label="Animated pixel creature"></div>
    </button>
    <div class="pet-name-row">
      <span id="pet-name">sparkiee</span>
      <span id="pet-status" class="pet-status">hanging out</span>
      <span id="connection-dot" class="connection-dot" title="Pet host connection"></span>
    </div>
    <div class="caption-box" id="caption-box" aria-live="polite">
      <span id="caption-text">Hey there, developer!</span>
    </div>
    <div class="pet-error" id="pet-error" hidden></div>
  </main>
</body>
</html>
